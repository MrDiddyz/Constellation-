name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "copilot/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: murmur-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: murmur-core/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run check:bundle-budget
      - run: npm run audit

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: murmur-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: murmur-core/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm install -g @lhci/cli@0.14.x
      - run: lhci autorun --config=.lighthouserc.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
